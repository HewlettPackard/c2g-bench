scenario:
  name: default
  env_id: default
  description: Baseline 250MW DC — 28°C ambient, NYISO NYC, 15MW regulation commitment
  grid_market: nyiso_nyc
  weather_market: nyiso_nyc
  weather_driven: true
  T_amb: 25.0
  committed_mw: 15.0
  bess_soc_init: 0.5
  cooling_fault: false
  genai_spike_scale: 1.0
  grid_stress_scale: 1.0
algo:
  name: sac
  timesteps: 400000
  n_envs: 1
  eval_freq: 5000
  n_eval_episodes: 5
  learning_rate: 0.0003
  buffer_size: 100000
  learning_starts: 2000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_update_interval: 1
  net_arch:
  - 256
  - 256
market:
  id: nyiso_nyc
  description: NYISO New York City (Real load + weather data)
env_overrides:
  grid_market: nyiso_nyc
  weather_market: nyiso_nyc
logging:
  tensorboard: true
  csv: true
  console_freq: 20
experiment:
  name: ${algo.name}_${scenario.name}
  seed: 200
  market: ${scenario.grid_market}
device: cpu
