[project]
name = "c2g-macro"
version = "0.1.0"
description = "Hierarchical AI Orchestration for Grid-Interactive Hyperscale Data Centers — NeurIPS 2026 Benchmark"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # Phase 1 — Physics simulators
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    # Phase 2 — RL environment
    "gymnasium>=1.0",
    # Phase 4 — Baseline agents
    "stable-baselines3>=2.3",
    "tensorboard>=2.17",
    "hydra-core>=1.3",
]

[project.optional-dependencies]
pysam = [
    # Must install separately; binaries are platform-specific.
    # See: https://nrel-pysam.readthedocs.io/
    "nrel-pysam>=5.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["c2g_env", "preprocessing"]
