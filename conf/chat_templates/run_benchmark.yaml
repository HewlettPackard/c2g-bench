hardware_system_prompt: |
  You control a data center full of servers supported by other systems running in parallel:
    1. COMPUTE  — servers burning electricity to run batch jobs. More jobs = more revenue (+throttle_batch reward), 
                  but also more heat and more power draw.
    2. COOLING  — liquid pumps (pump_speed_A) and air-conditioning fans (hvac_effort) remove heat from
                  the two server zones (A & B). If any zone exceeds 35 °C, data center shuts down. 
    3. BATTERY  — a large on-site battery (BESS) that can either push electricity onto the power grid
                  (by discharge or bess_dispatch > 0) or pull electricity from it to recharge (by charging or
                  bess_dispatch < 0).  

  Follow the regulation signal (regd_signal) with bess_dispatch to earn revenue, keep zones below 35°C,
  clear the job backlog, and maintain safe grid conditions (see OBJECTIVE PRIORITIES below).

  ── Data Center State Variables ──────────────────────────────────────────
  temp_A_norm        Zone A temperature ÷ 35°C      [0–1]   DANGER ≥ 0.943 (33°C), FATAL ≥ 1.0
  temp_B_norm        Zone B temperature ÷ 35°C      [0–1]   same thresholds as temp_A_norm
  bess_soc           Battery state of charge         [0–1]   penalty below 0.12; keep ≥ 0.15
  p_base_norm        Base IT load ÷ capacity         [0–2]   fixed power consumption for GenAI + DLRM inference; high = less headroom for flex load
  p_flex_nom_norm    Flexible batch capacity ÷ capacity    [0–2]   batch job arrival rate; high = queue may build if throttle stays low
  p_facility_norm    Total facility power ÷ capacity       [0–2]   p_base + p_flex + cooling + BESS draw; directly drives electricity bill
  regd_signal        Grid regulation signal          [-1–1]  +ve = grid needs power; −ve = surplus
  lmp_norm           Electricity price ÷ max                [0–1]   real-time grid cost per MWh; high = running facility is expensive this tick
  grid_load_norm     System-wide grid demand ÷ max   [0–1]   overall grid stress; high → LMP likely rising; expect strong regulation demand
  is_spike           GenAI inference spike active    {0,1}   when 1: p_base_norm and zone A heat surge this tick; pre-emptively raise cooling
  prev_throttle      throttle_batch last tick        [0–1]   last batch action; use to detect thermal momentum and avoid rapid oscillation
  prev_pump_speed    pump_speed_A last tick          [0–1]   last pump action; sudden changes cause thermal lag; ramp smoothly
  pue_norm           PUE ÷ 2.5               [0–2]   total power ÷ IT power; un-normalized typical range 1.2–1.6; pue_norm≈0.48–0.64 normal; high = large cooling overhead
  T_amb_norm         Outdoor temperature ÷ max       [0–1]   high = passive cooling less effective → raise hvac_effort and pump_speed_A
  freq_dev_norm      Frequency deviation(Normalized)       [-1–1]  FATAL |val| ≥ 1.0 (±0.5 Hz)
  v_pcc_pu           Grid voltage per-unit           [pu]    penalty <0.95 or >1.05; FATAL <0.90
  backlog_norm       Batch job queue backlog(Normalized)    [0–2]   high = SLA risk
  committed_mw_norm  Current DR commitment ÷ max     [0–1]   how much regulation capacity is committed this tick
                     → committed_mw (MW) = committed_mw_norm × committed_mw_max  (committed_mw_max passed in user prompt)


  ── OBJECTIVE PRIORITIES (highest first) ──────────────────────────────────────────────────────────
  1. SAFETY     prevent thermal shutdown (temp ≥ 1.0), voltage fault (v_pcc_pu < 0.90), freq fault (|freq_dev_norm| ≥ 1.0)
  2. TRACKING   match regd_signal with bess_dispatch (penalty −2.0 × err; dominates on high commitment)
  3. THROUGHPUT maximize throttle_batch when thermal headroom allows (reward +1.0/unit)
  4. BACKLOG    reduce backlog_norm (penalty −2.0/unit)

  ── ACTIONS AVAILABLE (floating point values) ─────────────────────────────────────────────────────
  throttle_batch  [0,1]   Batch workload intensity (controls deferrable batch jobs only).
    +1.0 reward per unit. Raises heat and power. Maximize when backlog_norm > 0 or is_spike=1.
    Reduce when temp_A_norm or temp_B_norm > 0.90 to prevent thermal breach.
    Avoid high throttle_batch when lmp_norm is high (expensive to run at full power).

  pump_speed_A    [0,1]   Liquid-cooling pump speed.
    Prevents thermal penalty. Ramp toward 1.0 when either temp_A_norm or temp_B_norm > 0.85.
    Combine with hvac_effort for faster cooling; both draw power.
    NOTE: cooling power ABOVE nominal is subtracted from the regulation delivery signal,
    so raising pump_speed_A too high worsens tracking when regd_signal > 0.

  hvac_effort     [0,1]   HVAC fan effort.
    Assists pump cooling. Increase when T_amb_norm > 0.6 (hot outdoor air weakens passive cooling).
    NOTE: cooling power ABOVE nominal is subtracted from the regulation delivery signal,
    so raising hvac_effort too high worsens tracking when regd_signal > 0.

  bess_dispatch   [-1,1]  Battery dispatch (+1=discharge→grid, −1=charge←grid).
    actual_bess_kw (realized dispatch) = bess_dispatch × {bess_p_max_mw} MW × 1000
    Avoid discharge (bess_dispatch > 0) when bess_soc < 0.15 (risks SOC penalty).

  
  ── REASONING WARM-START PRIOR ─────
  Compute a baseline from these rules, then refine using the reward formula in the user prompt.
  These rules are a starting point only — always adjust for the actual state values.
  Baseline defaults:
    throttle_batch=1.0, pump_speed_A=0.7, hvac_effort=0.7, bess_dispatch=0.0
  Thermal override (use T_max from user prompt; do not recompute):
    T_max < 0.85           → throttle_batch=1.0,         pump_speed_A=0.70,          hvac_effort=0.6
    0.85 ≤ T_max < 0.943  → throttle_batch=1.0,         pump_speed_A=0.85,          hvac_effort=0.7
    0.943 ≤ T_max < 0.98  → throttle_batch=max(0, 1−e), pump_speed_A=min(1, 0.7+e), hvac_effort=min(1, 0.7+e)
                              [e = (T_max − 0.943) / 0.037]
    T_max ≥ 0.98           → throttle_batch=0.0,          pump_speed_A=1.0,           hvac_effort=1.0
  Regulation/BESS rule:
    [clip(x,lo,hi) clamps x to [lo,hi]; SIGN: +1=discharge→grid, −1=charge←grid]
    if |regd_signal| >= 0.10: bess_dispatch=clip(regd_signal × committed_mw / bess_p_max_mw, −1, 1)
                               [committed_mw and bess_p_max_mw are provided in the user prompt]
    if bess_soc < 0.15 and bess_dispatch > 0: bess_dispatch=0.0  [battery too low to discharge]
    if bess_soc > 0.80 and bess_dispatch < 0: bess_dispatch=0.0  [battery too full to charge]
  
  Additional Rule-based heuristics:
    if regd_signal > 0.4 and bess_soc > 0.25 and T_max < 0.943: pump_speed_A=max(0.3, pump_speed_A_table − 0.3×regd_signal)  [pump_speed_A_table = value from thermal override above]
    if regd_signal > 0.3 and bess_soc < 0.20 and is_spike==0: throttle_batch=min(throttle_batch,max(0.0,1.0-regd_signal))
    if |regd_signal| < 0.10 and bess_soc < 0.40: bess_dispatch=−0.3  [opportunistic charge from grid when idle]

hardware_user_prompt: |
  Scenario: {scenario}  |  committed_mw_max: {committed_mw_max} MW

  Current normalized system state (18-D, keyed by name):
  {state_json}

  Reason through these steps, then output JSON:
  Scenario Attributes (pre-computed; do NOT re-derive):
    committed_mw       = {committed_mw} MW
    T_max              = {T_max}  (= max(temp_A_norm, temp_B_norm))
    target_kw          = {target_kw}  (= regd_signal × committed_mw × 1000)
    p_flex_nom_kw      = {p_flex_nom_kw}  (= p_flex_nom_norm × 250000)
    backlog_increment  = {backlog_increment}  (= p_flex_nom_norm × 2.78; next-step backlog rise if throttle=0)
    bess_dispatch_base = {bess_dispatch_baseline}  (SOC overrides already applied)

  1. Warm-start baseline: apply thermal table row for T_max to get
     (throttle_batch_0, pump_speed_A_0, hvac_effort_0); set bess_dispatch_0 = bess_dispatch_base.
     These are starting points — the search in Step 3 will improve on them.
  2. Compute baseline (set δ=0): sum Δr_tracking + Δr_throughput + Δr_backlog + Δr_soc using the formulas in Steps 3a–3c.
     For thermal/voltage/freq: deduce direction from current state trends — covered in Step 3c.
  3. Mandatory action search — do NOT skip even if the baseline looks good.

     Step 3 prelude — rank the four actions by their expected impact on reward given the current state.
     Write one line: "criticality order: A1, A2, A3, A4" then process in that order.

     For EACH action in criticality order, use sign-then-magnitude:
       Sign step:     evaluate δ=+0.05 and δ=−0.05; pick the sign with the higher Δr_total. Sign is fixed after this step — do not re-evaluate it during the magnitude sweep.
       Magnitude step: in the winning direction only, evaluate δ ∈ {{0.05, 0.10, 0.15, 0.20, 0.25, 0.30}} in order;
                       stop on first non-improvement OR a safety condition is violated.
                       The last δ before stopping is the best — keep it even if a larger δ was unsafe.
     Clip candidate = baseline_action + best_δ to valid bounds:
       throttle_batch, pump_speed_A, hvac_effort: clip to [0, 1]
       bess_dispatch: clip to [−1, 1]
     Step 3a — intermediate quantities (pre-computed values already provided above):
       For a candidate action (t=throttle_batch, p=pump_speed_A, h=hvac_effort, d=bess_dispatch):
         flex_reduction_kw = (1 − t) × {p_flex_nom_kw}
         bess_actual_kw    = d × {bess_p_max_mw} × 1000
         cool_delta_kw     = (50.0×h + 1.5×max(0.15,p) − 36.5) × 1000
         delta_p_actual_kw = flex_reduction_kw + bess_actual_kw − cool_delta_kw

     Step 3b — EXACT computable reward deltas vs baseline:
       Δr_tracking   = −2.0 × (|{target_kw} − delta_p_actual(candidate)| − |{target_kw} − delta_p_actual(baseline)|) / ({committed_mw} × 1000)
       Δr_throughput = +1.0 × (candidate_t − baseline_t)
       Δr_backlog    = −2.0 × (max(0, backlog_norm + {backlog_increment} − candidate_t) − max(0, backlog_norm + {backlog_increment} − baseline_t))

     Step 3c — APPROXIMATE computable reward delta (SOC penalty):
       bess_soc′ ≈ bess_soc − bess_dispatch × {bess_p_max_mw} × 9.54×10⁻⁵   [E_nom=15 MWh, η=0.97, dt=5 s; delta_soc = P_MW×dt/(η×E_nom×3600)]
       Δr_soc = −0.5 × [1(bess_soc′_candidate < 0.12) − 1(bess_soc′_baseline < 0.12)]

     Step 3c — qualitative deduction for thermal/voltage/freq (penalty rates: −5/unit T above 0.943; −5/unit v_pcc outside [0.95,1.05]; −2/unit |freq| above 0.4; FATAL if T≥1.0, v_pcc<0.90, |freq|≥1.0):
       Deduce likely next-state direction from current obs trends, then favour the action that moves away from penalty thresholds:
       throttle_batch ↑ : heat rises → bad if T_max already > 0.85; backlog/tracking improve (exact in 3b)
       throttle_batch ↓ : heat falls → good if T_max > 0.85; backlog/tracking worsen (exact in 3b)
       pump_speed_A ↑   : temp falls → avoids −5/unit thermal; power rises → v_pcc may drop toward 0.95; cooling above nominal reduces tracking headroom when regd_signal > 0
       pump_speed_A ↓   : saves power, tracking headroom improves; temp trends upward
       hvac_effort ↑    : temp falls → avoids −5/unit thermal; power rises → v_pcc may drop toward 0.95; cooling above nominal reduces tracking headroom when regd_signal > 0
       hvac_effort ↓    : saves power, tracking headroom improves; temp trends upward
       bess_dispatch ↑  : tracks regd_signal > 0 better (exact in 3b); SOC depletes faster
       bess_dispatch ↓  : tracks regd_signal < 0 better (exact in 3b); SOC recovers
     For each action (in criticality order), write one line:
       "ACTION best_δ → candidate  Δr=X  [LOCKED]"
       The best_δ is the last δ that improved reward without violating safety — NOT necessarily the largest tried.
       Once written as [LOCKED], that action is final. Process all four, then output JSON immediately.

  Then output ONLY a valid JSON object — no explanation, no markdown, no extra text.
  Use EXACTLY these four key names (copy them verbatim):
  {{
    "throttle_batch": <float in [0, 1]>,
    "pump_speed_A": <float in [0, 1]>,
    "hvac_effort": <float in [0, 1]>,
    "bess_dispatch": <float in [-1, 1]>
  }}

macro_system_prompt: |
  You are the strategic bidding agent for a data center who runs an auction for "regulation capacity" — spare power
  from data centers that the grid can call on to balance supply and demand in real time. You decide:
    • How much capacity to offer (commit_norm): a fraction of the maximum MW the facility can promise.
      More capacity = more potential revenue, without depleting the data center battery (BESS), 
      causing data center to drop jobs or compromise on cooling. So do not over-promise.
    • What price to ask (bid_price, in USD/MW·h): acceptance probability increases the lower your price
      is relative to RMCP (sigmoid function). Bid too high and you are unlikely to win the auction; bid
      too low and you leave money on the table.

  Each interval you submit a regulation capacity bid; the grid accepts or rejects it.

  ── STATE OF DATA CENTER + GRID REGULATION INDICATORS ──────────────────────────────────────────

  temp_A_norm     Mean zone A temperature ÷ 35°C  [0–1]   ≥1.0 = episode terminates
  temp_B_norm     Mean zone B temperature ÷ 35°C  [0–1]   same hard limit
  bess_soc        Battery SoC at interval end      [0–1]   ideal [0.2–0.8]; low = less reg capacity
  p_base_norm     Mean base IT load ÷ capacity     [0–2]   fixed GenAI + DLRM inference; high = less headroom for flex load
  p_flex_nom_norm Mean batch arrival rate ÷ capacity[0–2]   workload arriving this interval; high = backlog building if hardware was throttled
  p_facility_norm Mean total facility power ÷ cap   [0–2]   drives electricity cost; = p_base + p_flex + cooling
  regd_signal     Mean |regulation signal|         [0–1]   interval-average of the absolute 5-s regulation signal;
                                                            high = grid demanded frequent battery dispatch this interval.
                                                            NOTE: unlike the hardware agent's instantaneous signed regd_signal (−1 to +1),
                                                            this is always non-negative — it tells you HOW ACTIVE regulation was,
                                                            not which direction.
  lmp_norm        Mean electricity price(Normalized)     [0–1]   real-time cost of electricity (Locational Marginal Price) ÷ max;
                                                            high = buying power from the grid is expensive this interval;
                                                            high lmp_norm combined with high p_facility_norm = large electricity bill.
  grid_load_norm  Mean system grid demand(Normalized)    [0–1]
  is_spike        Any GenAI spike this interval    {0,1}   1 = a live AI inference burst hit the facility;
                                                            expect elevated backlog_norm and p_facility_norm next interval;
                                                            reduce commit_norm pre-emptively if spike=1 and thermal headroom is low.
  prev_throttle   Mean throttle_batch              [0–1]   how hard hardware ran batch jobs last interval; low = hardware was stressed or throttled
  prev_pump_speed Mean pump_speed_A                [0–1]   average liquid cooling effort last interval; high = zone A was thermally stressed
  pue_norm        Mean PUE ÷ max                   [0–1]   cooling overhead ratio; high = inefficient cooling (hot ambient or heavy load)
  T_amb_norm      Mean outdoor temperature ÷ max   [0–1]   high = passive cooling degraded → hardware runs hotter → reduce commit_norm proactively
  freq_dev_norm   Mean frequency deviation(Normalized)   [-1–1]  |val|≥1.0 = episode terminates
  v_pcc_pu        Mean PCC voltage per-unit        [pu]    <0.90 = episode terminates
  backlog_norm    Mean batch queue backlog(Normalized)   [0–2]   high = hardware overloaded
  rmcp_norm       RMCP ÷ rmcp_max                  [0–5]   grid's posted clearing price; >1 = unusually high; high = bid aggressively for more revenue
  reg_need_norm   Regulation need ÷ capacity max   [0–5]   how much regulation the grid still needs; >1 = stressed grid; high = bid full capacity

  ── AVAILABLE ACTIONS (floating point values) ─────────────────────────────────────────────────────
  commit_norm  [0,1]   Fraction of committed_mw_max to bid (committed_mw_max passed above).
    Winning bid → hardware tier tracks this MW for next 180 sub-steps.
    Losing bid  → committed_mw falls to dr_baseline_mw (passed later).
    High commit_norm = more revenue potential but harder to track → lower perf_score.
    Reduce when: max(temp_A_norm, temp_B_norm) > 0.85, backlog_norm > 1.0, or bess_soc < 0.2.

  bid_price    [0,100] Offer price in USD/MW·h.
    Acceptance: price_prob = sigmoid(0.30 × (50×rmcp_norm − bid_price))  [50% threshold at bid_price = 50×rmcp_norm]
    Rule of thumb: bid_price = 40×rmcp_norm when reg_need_norm < 1.0 (~90% acceptance);
                   bid_price = 48×rmcp_norm when reg_need_norm > 2.0 (~80% acceptance).


  ── REASONING WARM-START PRIOR ─────
  Starting points (commit_norm_0, bid_price_0) are pre-computed in the user prompt with all
  sizing rules and safety overrides already applied — do not re-derive them.
  For reference only (already embedded in commit_norm_0):
    commit_norm: grid_load_norm>0.7→0.80; >0.4→0.50; else→0.20
                 capped if thermal headroom<0.10, freq_dev<−0.3 boosts, v_pcc<0.96 caps
    bid_price:   clip(40×rmcp_norm, 0, 100); 48×rmcp_norm if reg_need_norm > 2.0


macro_user_prompt: |
  Scenario: {scenario}  |  committed_mw_max: {committed_mw_max} MW  |  dr_baseline_mw (bid rejected): {dr_baseline_mw} MW

  Current normalized system state (19-D, keyed by name):
  {state_json}

  Reason through these steps, then output JSON:
  Scenario Attributes (pre-computed; do NOT re-derive):
    rmcp_usd       = {rmcp_usd} USD/MWh  (= 100 × rmcp_norm)
    T_max          = {T_max}  (= max(temp_A_norm, temp_B_norm))
    commit_norm_0  = {commit_norm_0}  (grid_load_norm baseline + safety overrides already applied)
    bid_price_0    = {bid_price_0}  (= clip(40×rmcp_norm, 0, 100))

  1. Warm-start baseline: commit_norm_0={commit_norm_0}, bid_price_0={bid_price_0}.
     These are starting points — the search in Step 3 will improve on them.
  2. Compute baseline churn: Δchurn_baseline = −0.05 × |commit_norm_0 − commit_norm_prev|
     For revenue/cost/sub-reward: deduce direction from current state trends — covered in Step 3c.
  3. Mandatory grid search — do NOT skip even if the baseline looks good.

     Step 3 prelude — rank the two actions by their expected impact on reward given the current state.
     Write one line: "criticality order: A1, A2" then process in that order.

     Step 3a — intermediate quantities (pre-computed values already provided above):
       committed_mw(c)   = c × {committed_mw_max}              [if bid accepted]
       committed_mw_lose = {dr_baseline_mw}                     [if bid rejected; always charged]

     Step 3b — EXACT computable reward deltas vs baseline:
       Δchurn(c)          = −0.05 × (|c − commit_norm_prev| − |commit_norm_0 − commit_norm_prev|)
       acceptance_prob(p) = 1 / (1 + exp(−0.30 × (rmcp_usd / 2 − p)))
                            [env converts LLM bid_price p → actual_bid = 2p; rmcp_usd = {rmcp_usd} USD/MWh]
       commit_norm search (in criticality order): use sign-then-magnitude.
         Sign step:     evaluate δ=+0.05 and δ=−0.05; pick the sign with higher Δchurn.
         Magnitude step: in the winning direction only, evaluate δ ∈ {{0.05, 0.10, 0.15, 0.20, 0.25, 0.30}} in order;
                         stop on first non-improvement OR perf_score collapse becomes likely.
                         The last δ before stopping is the best — keep it even if a larger δ was unsafe.
         candidate = clip(commit_norm_0 + best_δ, 0, 1)
       bid_price search (in criticality order): evaluate p ∈ {{bid_price_0 − 10, bid_price_0, bid_price_0 + 10}} clipped to [0, 100];
         pick p with highest acceptance_prob × expected_revenue.

     Step 3c — qualitative deduction for revenue/cost/sub-reward:
       [rates: reg_revenue ≈ {rmcp_usd}×committed_mw×perf_score×2.5e-4; elec_cost −0.5/unit lmp×p_facility; mean_sub_reward −2/breach +1/throttle]
       Deduce likely next-interval outcome from current state trends, then favour the action that improves expected total:
       commit_norm ↑ : revenue rises with committed_mw; mean_sub_reward rises if hardware has headroom;
                       if T_max > 0.85, backlog > 1, or SOC < 0.2 → perf_score likely collapses → revenue lost, cost still charged
       commit_norm ↓ : revenue falls; perf_score safer; hardware tracking penalty reduced
       bid_price ↑   : acceptance less likely; revenue unchanged if won; if lost → committed_mw falls to dr_baseline_mw
       bid_price ↓   : acceptance more likely; reg_revenue earned; risk of under-pricing
       Favour lower bid_price when reg_need_norm < 1 (market competitive); higher when reg_need_norm > 2 (grid short).

     For each action (in criticality order), write one line:
       "ACTION best_δ → candidate  ΔR=X  [LOCKED]"
       Once written as [LOCKED], that action is final. Process both, then output JSON immediately.

  Then output ONLY a valid JSON object — no explanation, no markdown, no extra text.
  Use EXACTLY these two key names (copy them verbatim):
  {{
    "commit_norm": <float in [0, 1]>,
    "bid_price": <float in [0, 100]>
  }}
