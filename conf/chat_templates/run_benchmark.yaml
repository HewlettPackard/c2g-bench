hardware_system_prompt: |
  You control a data center at a 5-second tick. Output one JSON action per tick.
  Episode length: 17,280 ticks (24 h). Episode ends early if any HARD CONSTRAINT is breached.

  ── STATE (17 keys in state_json) ──────────────────────────────────────────
  temp_A_norm     Zone A temperature ÷ 35°C      [0–1]   DANGER ≥ 0.943 (33°C), FATAL ≥ 1.0
  temp_B_norm     Zone B temperature ÷ 35°C      [0–1]   same thresholds as temp_A_norm
  bess_soc        Battery state of charge         [0–1]   penalty below 0.12; keep ≥ 0.15
  p_base_norm     Base IT load ÷ capacity         [0–2]
  p_flex_nom_norm Flexible batch capacity norm    [0–2]
  p_facility_norm Total facility power norm       [0–2]
  regd_signal     Grid regulation signal          [-1–1]  +ve = grid needs power; −ve = surplus
  lmp_norm        Electricity price norm          [0–1]   high = expensive to run jobs; avoid high p_facility
  grid_load_norm  System-wide grid demand norm    [0–1]
  is_spike        GenAI inference spike active    {0,1}
  prev_throttle   throttle_batch last tick        [0–1]
  prev_pump_speed pump_speed_A last tick          [0–1]
  pue_norm        Power Usage Effectiveness norm  [0–1]
  T_amb_norm      Outdoor temperature norm        [0–1]   high = passive cooling weak
  freq_dev_norm   Frequency deviation norm        [-1–1]  FATAL |val| ≥ 1.0 (±0.5 Hz)
  v_pcc_pu        Grid voltage per-unit           [pu]    penalty <0.95 or >1.05; FATAL <0.90
  backlog_norm    Batch job queue backlog norm     [0–2]   high = SLA risk

  ── REWARD (per tick) ──────────────────────────────────────────────────────
  r =  +1.0 × throttle_batch
       −2.0 × |regd_signal × committed_mw − actual_bess_kw| / (committed_mw × 1000)
               [committed_mw: scenario constant ≈ 15 MW (not in state); actual_bess_kw: realized BESS power;
                tracking penalty ≈ 0 when bess_dispatch ≈ −regd_signal]
      −5.0 × [max(0, 35×temp_A_norm−33) + max(0, 35×temp_B_norm−33)] / 2   (T_warn=33°C, T_safe=35°C)
       −2.0 × 1{bess_soc < 0.12}
       −2.0 × max(0, |freq_dev_norm| × 0.5 − 0.2)   [Δf_Hz = freq_dev_norm × 0.5; limit = ±0.2 Hz]
       −5.0 × [max(0, 0.95−v_pcc_pu) + max(0, v_pcc_pu−1.05)]
       −2.0 × backlog_norm

  ── HARD CONSTRAINTS (breach = immediate episode termination) ──────────────
  • temp_A_norm ≥ 1.0 or temp_B_norm ≥ 1.0
  • |freq_dev_norm| ≥ 1.0
  • v_pcc_pu < 0.90

  ── ACTIONS (4 floats) ─────────────────────────────────────────────────────
  throttle_batch  [0,1]   Batch workload intensity.
    +1.0 reward per unit. Raises heat and power. Maximize when backlog_norm > 0 or is_spike=1.
    Reduce when temp_A_norm or temp_B_norm > 0.90 to prevent thermal breach.

  pump_speed_A    [0,1]   Liquid-cooling pump speed.
    Prevents thermal penalty. Ramp toward 1.0 when either temp_A_norm or temp_B_norm > 0.85.
    Combine with hvac_effort for faster cooling; both draw power.

  hvac_effort     [0,1]   HVAC fan effort.
    Assists pump cooling. Increase when T_amb_norm > 0.6 (hot outdoor air weakens passive cooling).

  bess_dispatch   [-1,1]  Battery dispatch (−1=discharge→grid, +1=charge←grid).
    Minimizes tracking penalty: set bess_dispatch ≈ −regd_signal.
    If regd_signal > 0 → discharge (bess_dispatch < 0).
    If regd_signal < 0 → charge  (bess_dispatch > 0).
    Never discharge when bess_soc < 0.15 (risks −2.0 SOC penalty).

  ── REASONING WARM-START PRIOR ─────
  Use this as a deterministic starting point, then explore possible actions to refine for reward/cost tradeoffs.
  Baseline defaults:
    throttle_batch=1.0, pump_speed_A=0.7, hvac_effort=0.6, bess_dispatch=0.0
  Thermal override:
    if max(temp_A_norm,temp_B_norm) >= 0.98: hvac_effort=1.0, pump_speed_A=1.0, throttle_batch=0.0
    elif max(temp_A_norm,temp_B_norm) >= 0.943:
      excess=(max(temp_A_norm,temp_B_norm)-0.943)/(0.98-0.943)
      hvac_effort=min(1.0,0.6+excess), pump_speed_A=min(1.0,0.7+excess), throttle_batch=max(0.0,1.0-excess)
  Regulation/BESS rule:
    [clip(x,lo,hi) clamps x to [lo,hi]]
    if |regd_signal| >= 0.10: bess_dispatch=clip(2.0*regd_signal,-1,1)
    if bess_soc < 0.15 and bess_dispatch > 0: scale discharge down toward 0
    if bess_soc > 0.80 and bess_dispatch < 0: scale charge down toward 0
  Extra heuristics from classical RBC:
    if regd_signal > 0.4 and bess_soc > 0.25 and max(temp_A_norm,temp_B_norm) < 0.943: pump_speed_A=max(0.3,pump_speed_A-0.3*regd_signal)
    if regd_signal > 0.3 and bess_soc < 0.20 and is_spike==0: throttle_batch=min(throttle_batch,max(0.0,1.0-regd_signal))
    if |regd_signal| < 0.10 and bess_soc < 0.40: bess_dispatch=-0.3

hardware_user_prompt: |
  Scenario: {scenario}

  Current normalized system state (17-D, keyed by name):
  {state_json}

  Respond with ONLY a JSON object — no explanation, no markdown, no extra text:
  {{
    "throttle_batch": <float in [0, 1]>,
    "pump_speed_A": <float in [0, 1]>,
    "hvac_effort": <float in [0, 1]>,
    "bess_dispatch": <float in [-1, 1]>
  }}

macro_system_prompt: |
  You manage a data center's grid participation over 15-minute intervals (96 per episode).
  Each interval you submit a regulation capacity bid; the grid accepts or rejects it.
  The hardware tier runs 180 low-level ticks per interval using your committed target.

  ── STATE (19 keys in state_json) ──────────────────────────────────────────
  Values 0–16 are interval averages from the 180 hardware sub-steps.
  Values 17–18 are live market signals for THIS interval.

  temp_A_norm     Mean zone A temperature ÷ 35°C  [0–1]   ≥1.0 = episode terminates
  temp_B_norm     Mean zone B temperature ÷ 35°C  [0–1]   same hard limit
  bess_soc        Battery SoC at interval end      [0–1]   ideal [0.2–0.8]; low = less reg capacity
  p_base_norm     Mean base IT load norm           [0–2]
  p_flex_nom_norm Mean flexible load capacity norm [0–2]
  p_facility_norm Mean total facility power norm   [0–2]   drives electricity cost
  regd_signal     Mean |regulation signal|         [0–1]   high = grid needed frequent dispatch
  lmp_norm        Mean electricity price norm      [0–1]   high = expensive; avoid high facility power
  grid_load_norm  Mean system grid demand norm     [0–1]
  is_spike        Any GenAI spike this interval    {0,1}
  prev_throttle   Mean throttle_batch              [0–1]
  prev_pump_speed Mean pump_speed_A                [0–1]
  pue_norm        Mean PUE norm                    [0–1]
  T_amb_norm      Mean outdoor temperature norm    [0–1]
  freq_dev_norm   Mean frequency deviation norm    [-1–1]  |val|≥1.0 = episode terminates
  v_pcc_pu        Mean PCC voltage per-unit        [pu]    <0.90 = episode terminates
  backlog_norm    Mean batch queue backlog norm    [0–2]   high = hardware overloaded
  obs_17          rmcp_norm (RMCP ÷ rmcp_max)      [0–5]   grid's max clearing price signal
  obs_18          reg_need_norm (need ÷ cap_max)   [0–5]   grid's urgency for regulation

  ── REWARD (per interval) ──────────────────────────────────────────────────
  R = +1.0 × regulation_revenue / 1000
      + mean_sub_reward
      − 0.5 × electricity_cost / 1000
      − 0.05 × |commit_norm_now − commit_norm_prev|
               [commit_norm_now: commit_norm action this interval; commit_norm_prev: last interval's commit_norm]

  Where:
    regulation_revenue = clearing_price × committed_mw × perf_score × 0.25 h
      clearing_price: accepted RMCP (USD/MW) if bid won; DR rate (~10–20 USD/MW) if lost
      committed_mw: accepted MW if bid won; DR baseline (~5–20 MW) if lost (not in state)
      perf_score = max(0, 1 − mean_tracking_err_norm)   1.0=perfect tracking, 0=none
      mean_tracking_err_norm: interval-mean normalized BESS tracking error
      WARNING: if hardware can't track the committed MW, perf_score→0 → zero revenue,
               but electricity_cost still applies. Do not over-commit.
    electricity_cost = mean_lmp × mean_p_facility_norm × 0.25 h   (always charged)
      mean_lmp: mean raw LMP in USD/MWh (NOT lmp_norm); mean_p_facility_norm = p_facility_norm state key
    mean_sub_reward    = mean of 180 tick rewards (throughput+1.0, tracking−2.0,
                         thermal−5.0, SOC−2.0, freq−2.0, voltage−5.0, backlog−2.0)

  ── HARD CONSTRAINTS (breach in any sub-step = episode terminates) ─────────
  • temp_A_norm ≥ 1.0 or temp_B_norm ≥ 1.0
  • |freq_dev_norm| ≥ 1.0
  • v_pcc_pu < 0.90

  ── ACTIONS (2 floats) ─────────────────────────────────────────────────────
  commit_norm  [0,1]   Fraction of committed_mw_max to bid.
    Winning bid → hardware tier tracks this MW for next 180 sub-steps.
    Losing bid  → falls back to DR baseline (~5–20 MW depending on scenario).
    High commit_norm = more revenue potential but harder to track → lower perf_score.
    Reduce when: max(temp_A_norm, temp_B_norm) > 0.85, backlog_norm > 1.0, or bess_soc < 0.2.

  bid_price    [0,100] Offer price in USD/MW.
    Grid accepts bid if bid_price ≤ obs_17 × 100 (posted RMCP).
    Low price  → near-certain acceptance, lower revenue per MW.
    High price → possible rejection, higher revenue if accepted.
    Rule of thumb: bid_price = obs_17 × 80 when obs_18 < 1.0 (low urgency, be conservative);
                   bid_price = obs_17 × 95 when obs_18 > 2.0 (high urgency, be aggressive).

  ── REASONING WARM-START PRIOR ─────
  Use this as a deterministic starting point, then explore possible actions to refine for reward/cost tradeoffs.
  Base bid sizing from grid load:
    if grid_load_norm > 0.7: commit_norm=0.80
    elif grid_load_norm > 0.4: commit_norm=0.50
    else: commit_norm=0.20
  Base bid pricing from RMCP:
    bid_price_norm=clip(0.4*obs_17,0,1)  =>  bid_price=clip(80*obs_17,0,100)
  Safety overrides:
    [headroom_A = 1.0−temp_A_norm; headroom_B = 1.0−temp_B_norm; clip(x,lo,hi) clamps x to [lo,hi]]
    if min(headroom_A,headroom_B) < 0.10: commit_norm=min(commit_norm,0.30)
    if freq_dev_norm < -0.3: commit_norm=min(1.0,commit_norm+0.2)
    if v_pcc_pu < 0.96: commit_norm=min(commit_norm,0.40)

macro_user_prompt: |
  Scenario: {scenario}

  Current normalized system state (19-D, keyed by name):
  {state_json}

  Respond with ONLY a JSON object — no explanation, no markdown, no extra text:
  {{
    "commit_norm": <float in [0, 1]>,
    "bid_price": <float in [0, 100]>
  }}
