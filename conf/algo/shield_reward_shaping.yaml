name: shield_reward_shaping

# Training
timesteps: 300_000
n_envs: 4
eval_freq: 10_000
n_eval_episodes: 5

# PPO hyperparameters
learning_rate: 3.0e-4
n_steps: 512
batch_size: 128
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5

# Reward shaping penalty weights
w_thermal: 2.0           # quadratic penalty for T > T_warn
w_soc: 1.0               # quadratic penalty for SOC near bounds
w_freq: 1.5              # quadratic penalty for |Δf| > 0.2 Hz
w_voltage: 1.0           # quadratic penalty for V_pcc < 0.92
w_shield: 0.5            # discrete penalty per shield intervention
